spring:
  config:
    activate:
      on-profile: test

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

zonky:
  test:
    database:
      provider: zonky

logging:
  level:
    com.wanaia: INFO
    org.flywaydb: INFO
